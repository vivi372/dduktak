<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFDF7" />
    <title>오늘의 뚝딱 - 1인 가구 냉장고 파먹기 &amp; 레시피 매칭</title>
    <meta name="description" content="남은 재료로 뚝딱! 식재료 소비기한 관리부터 맞춤 레시피 추천까지 스마트한 1인 가구 냉장고 솔루션" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- 다크 모드 깜빡임(FOUC) 방지: 렌더링 전에 저장된 테마를 먼저 적용 -->
    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('dduktak-theme') || 'null');
          var theme = saved && saved.state && saved.state.theme;
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
