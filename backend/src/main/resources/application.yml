server:
  port: ${PORT:8080}
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: dduktak-backend

  datasource:
    # log4jdbc driver for detailed SQL & parameter logging
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    url: ${SPRING_DATASOURCE_URL:jdbc:log4jdbc:postgresql://${DB_HOST:aws-0-ap-northeast-2.pooler.supabase.com}:${DB_PORT:6543}/${DB_NAME:postgres}?sslmode=require&prepareThreshold=0}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres.hefryhbaoovrhgzevfad}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    hikari:
      pool-name: DduktakHikariPool
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 600000
      auto-commit: true

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.dduktak.domain
  type-handlers-package: com.dduktak.global.config
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

# Supabase / JJWT 토큰 설정 (JwtProperties 매핑, 배포 가이드 JWT_SECRET_KEY 및 로컬 JWT_SECRET 양방향 호환)
jwt:
  secret: ${JWT_SECRET_KEY:${JWT_SECRET:}}
  expiration: 86400000 # 24 hours (ms)
  refresh-expiration: 604800000 # 7 days (ms)
  supabase-url: ${VITE_SUPABASE_URL:https://hefryhbaoovrhgzevfad.supabase.co}
  supabase-key: ${VITE_SUPABASE_ANON_KEY:${VITE_SUPABASE_PUBLISHABLE_KEY:}}

# Google AI Studio Gemini API 설정 (영수증 OCR 스캔 연동, GEMINI_MODEL_NAME 및 GEMINI_MODEL 양방향 호환)
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL_NAME:${GEMINI_MODEL:gemini-3.5-flash-lite}}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

# Firebase Cloud Messaging (FCM 푸시 알림 설정)
fcm:
  credentials:
    path: ${FIREBASE_SERVICE_ACCOUNT_PATH:backend/src/main/resources/firebase-service-account.json}
    json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([%15.15t]){faint} %clr([%X{traceId:-SYSTEM}]){magenta} %clr(%-40.40logger{39}){cyan} : %msg%n"
  level:
    root: INFO
    "[com.dduktak]": DEBUG
    jdbc:
      sqltiming: INFO
      sqlonly: OFF
      audit: OFF
      resultset: OFF
      resultsettable: INFO
      connection: OFF
