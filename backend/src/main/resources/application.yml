server:
  port: ${PORT:8080}
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: dduktak-backend

  datasource:
    # log4jdbc driver for detailed SQL & parameter logging
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    url: jdbc:log4jdbc:postgresql://${DB_HOST:aws-0-ap-northeast-2.pooler.supabase.com}:${DB_PORT:6543}/${DB_NAME:postgres}?sslmode=require&prepareThreshold=0
    username: ${DB_USER:postgres.hefryhbaoovrhgzevfad}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: DduktakHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 600000
      auto-commit: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.dduktak.domain
  type-handlers-package: com.dduktak.global.config
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

# Supabase / JJWT 토큰 설정 (JwtProperties 매핑)
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 hours (ms)
  refresh-expiration: 604800000 # 7 days (ms)

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([%15.15t]){faint} %clr([%X{traceId:-SYSTEM}]){magenta} %clr(%-40.40logger{39}){cyan} : %msg%n"
  level:
    root: INFO
    "[com.dduktak]": DEBUG
    jdbc:
      sqltiming: INFO
      sqlonly: OFF
      audit: OFF
      resultset: OFF
      resultsettable: INFO
      connection: OFF
